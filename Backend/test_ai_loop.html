<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUPtime — AI Loop Tester</title>
    <style>
        :root {
            --bg: #0f0f13;
            --surface: #1a1a24;
            --surface2: #22223a;
            --border: #2a2a3d;
            --primary: #7c5cfc;
            --primary-glow: rgba(124,92,252,0.25);
            --accent: #00d9a3;
            --danger: #ff5c72;
            --warn: #f5a623;
            --text: #e8e6f0;
            --muted: #8b89a0;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: grid;
            grid-template-columns: 340px 1fr;
            grid-template-rows: 56px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Header ── */
        header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 0 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        header h1 {
            font-size: 1.1rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #connBadge {
            font-size: 0.72rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
            background: rgba(255,92,114,0.15);
            color: var(--danger);
            border: 1px solid var(--danger);
            transition: all 0.3s;
        }
        #connBadge.connected {
            background: rgba(0,217,163,0.15);
            color: var(--accent);
            border-color: var(--accent);
        }

        /* ── Left panel ── */
        aside {
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 16px;
            gap: 16px;
        }

        /* ── Right panel ── */
        main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Event log ── */
        #eventLog {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ── Loop UI (task choices area) ── */
        #loopPanel {
            padding: 16px;
            border-top: 1px solid var(--border);
            background: var(--surface);
            display: none;
            max-height: 50vh;
            overflow-y: auto;
        }

        /* ── Shared components ── */
        .section-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--muted);
            margin-bottom: 8px;
        }
        label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
        input, textarea, select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
            resize: vertical;
        }
        input:focus, textarea:focus { border-color: var(--primary); }
        textarea { min-height: 64px; font-family: inherit; }

        .divider { height: 1px; background: var(--border); }

        button {
            padding: 9px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s;
            width: 100%;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: #6a4ce0; }

        .btn-accent { background: var(--accent); color: #0f0f13; }
        .btn-accent:hover:not(:disabled) { background: #00bd8e; }

        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover:not(:disabled) { background: #e04060; }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-ghost:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }

        .btn-record { background: var(--danger); color: #fff; }
        .btn-record.recording { animation: pulse 1s infinite; }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(255,92,114,0.5); }
            50% { box-shadow: 0 0 0 10px rgba(255,92,114,0); }
        }

        /* ── Tabs ── */
        .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
        .tab {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 0;
            width: auto;
        }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* ── Event cards ── */
        .event {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            line-height: 1.5;
            border-left: 3px solid transparent;
            background: var(--surface);
        }
        .event-type {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 4px;
        }
        .event.loop_started  { border-color: var(--primary); }
        .event.loop_started .event-type { color: var(--primary); }
        .event.thinking      { border-color: var(--warn); }
        .event.thinking .event-type { color: var(--warn); }
        .event.task_choices  { border-color: var(--accent); }
        .event.task_choices .event-type { color: var(--accent); }
        .event.task_approved { border-color: var(--accent); }
        .event.task_approved .event-type { color: var(--accent); }
        .event.loop_complete { border-color: var(--primary); background: rgba(124,92,252,0.08); }
        .event.loop_complete .event-type { color: var(--primary); }
        .event.chat_response { border-color: var(--primary); }
        .event.chat_response .event-type { color: var(--primary); }
        .event.error         { border-color: var(--danger); background: rgba(255,92,114,0.07); }
        .event.error .event-type { color: var(--danger); }
        .event.raw           { border-color: var(--border); background: var(--surface2); font-family: monospace; font-size: 0.75rem; }

        /* ── Loop panel ── */
        .loop-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .loop-title { font-weight: 700; font-size: 0.95rem; }
        .loop-progress { font-size: 0.78rem; color: var(--muted); }

        .task-desc {
            padding: 10px 14px;
            background: var(--surface2);
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            border-left: 3px solid var(--accent);
        }

        .choice-card {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            background: var(--bg);
        }
        .choice-card .choice-id { font-size: 0.7rem; color: var(--muted); margin-bottom: 6px; }
        .action-row {
            font-size: 0.8rem;
            color: var(--text);
            padding: 4px 0;
            border-bottom: 1px solid var(--border);
        }
        .action-row:last-child { border-bottom: none; }
        .action-name { color: var(--accent); font-weight: 600; }
        .choice-actions-btns { display: flex; gap: 8px; margin-top: 10px; }
        .choice-actions-btns button { flex: 1; }

        .decline-area { margin-top: 12px; }
        .decline-area textarea { margin-bottom: 8px; }

        #thinkingAnim {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--warn);
            font-size: 0.85rem;
            font-weight: 600;
        }
        .dot-pulse span {
            display: inline-block;
            width: 6px; height: 6px;
            background: var(--warn);
            border-radius: 50%;
            animation: dotPulse 1.2s infinite ease-in-out;
        }
        .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
        .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse { 0%,80%,100%{transform:scale(0.8);opacity:0.5} 40%{transform:scale(1);opacity:1} }

        #rawToggle { font-size: 0.72rem; color: var(--muted); cursor: pointer; text-decoration: underline; }
        #rawToggle:hover { color: var(--text); }
    </style>
</head>
<body>

<header>
    <h1>PUPtime — AI Loop Tester</h1>
    <span id="connBadge">● Disconnected</span>
    <span style="flex:1"></span>
    <span id="rawToggle" onclick="toggleRaw()">Show raw events</span>
</header>

<!-- ── Left panel ── -->
<aside>

    <!-- Config -->
    <div>
        <div class="section-label">Connection</div>
        <label>Base URL</label>
        <input id="baseUrl" value="http://127.0.0.1:8000" style="margin-bottom:8px">
        <label>Auth Token</label>
        <input id="authToken" placeholder="Token from /api/auth/login/" style="margin-bottom:8px">
        <label>Conversation ID (optional)</label>
        <input id="convId" placeholder="Auto-fills after first message" style="margin-bottom:10px">
        <div style="display:flex;gap:8px;">
            <button class="btn-accent" onclick="connect()" id="connectBtn">Connect</button>
            <button class="btn-ghost" onclick="disconnect()" id="disconnectBtn" disabled style="width:auto;padding:9px 14px;">✕</button>
        </div>
    </div>

    <div class="divider"></div>

    <!-- Input tabs -->
    <div>
        <div class="tabs">
            <button class="tab active" onclick="switchTab('text')">Text</button>
            <button class="tab" onclick="switchTab('voice')">Voice</button>
        </div>

        <!-- Text input -->
        <div id="tabText">
            <label>Message</label>
            <textarea id="textInput" rows="3" placeholder="e.g. Buy groceries, call the dentist, and gym at 7pm"></textarea>
            <button class="btn-primary" style="margin-top:8px" onclick="sendText()" id="sendTextBtn" disabled>
                Send Message
            </button>
        </div>

        <!-- Voice input -->
        <div id="tabVoice" style="display:none">
            <button class="btn-record" id="recordBtn" onclick="toggleRecording()">🎤 Start Recording</button>
            <div id="recTimer" style="text-align:center;margin:6px 0;color:var(--danger);font-family:monospace;display:none">00:00</div>

            <div style="text-align:center;color:var(--muted);font-size:0.75rem;margin:10px 0">— or upload —</div>

            <label>Audio File</label>
            <input type="file" id="audioFile" accept="audio/*" style="margin-bottom:8px">

            <label>Text context (optional)</label>
            <input id="voiceText" placeholder="Optional description..." style="margin-bottom:8px">

            <audio id="previewAudio" controls style="width:100%;height:32px;margin-bottom:8px;display:none"></audio>

            <button class="btn-primary" onclick="uploadAndProcess()" id="sendVoiceBtn" disabled>
                Upload & Start Loop
            </button>
        </div>
    </div>

    <div class="divider"></div>

    <!-- Quick actions -->
    <div>
        <div class="section-label">Quick Actions</div>
        <button class="btn-ghost" onclick="clearLog()" style="margin-bottom:6px">Clear Log</button>
        <button class="btn-ghost" onclick="loadConversation()">Reload Conversation</button>
    </div>

</aside>

<!-- ── Right panel ── -->
<main>
    <div id="eventLog">
        <div style="color:var(--muted);font-size:0.82rem;text-align:center;margin-top:40px">
            Connect and send a message to start the AI loop.
        </div>
    </div>

    <!-- Loop interaction panel -->
    <div id="loopPanel">
        <div class="loop-header">
            <span class="loop-title" id="loopTitle">AI Loop</span>
            <span class="loop-progress" id="loopProgress"></span>
        </div>
        <div id="loopContent"></div>
    </div>
</main>

<script>
// ── State ───────────────────────────────────────────────────
let ws = null;
let currentLoopId = null;
let currentTaskIndex = 0;
let totalTasks = 0;
let showRaw = false;
let mediaRecorder = null;
let audioChunks = [];
let recordedBlob = null;
let recSeconds = 0;
let recTimer = null;

// ── Connection ──────────────────────────────────────────────
function connect() {
    const base = document.getElementById('baseUrl').value.replace(/\/$/, '');
    const token = document.getElementById('authToken').value.trim();
    if (!token) { alert('Auth token is required.'); return; }

    const wsUrl = `${base.replace('http', 'ws')}/ws/ai/chat/?token=${token}`;
    log('system', `Connecting to ${wsUrl}…`);
    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
        setBadge(true);
        log('system', 'Connected ✓');
        document.getElementById('connectBtn').disabled = true;
        document.getElementById('disconnectBtn').disabled = false;
        document.getElementById('sendTextBtn').disabled = false;
        document.getElementById('sendVoiceBtn').disabled = false;
    };

    ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        handleEvent(data);
        if (showRaw) logRaw(e.data);
    };

    ws.onclose = (e) => {
        setBadge(false);
        log('system', `Disconnected (code ${e.code})`);
        document.getElementById('connectBtn').disabled = false;
        document.getElementById('disconnectBtn').disabled = true;
        document.getElementById('sendTextBtn').disabled = true;
        document.getElementById('sendVoiceBtn').disabled = true;
    };

    ws.onerror = () => log('system', 'WebSocket error — check console');
}

function disconnect() {
    if (ws) ws.close();
}

function wsSend(payload) {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
        log('system', '⚠ Not connected.'); return false;
    }
    ws.send(JSON.stringify(payload));
    return true;
}

// ── Send message ────────────────────────────────────────────
function sendText() {
    const content = document.getElementById('textInput').value.trim();
    if (!content) return;
    const convId = document.getElementById('convId').value.trim();
    const payload = { type: 'text_message', content };
    if (convId) payload.conversation_id = convId;
    if (!wsSend(payload)) return;
    logEvent({ type: 'user_text', content });
    document.getElementById('textInput').value = '';
}

document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') sendText();
});

// ── Upload voice → process_voice ────────────────────────────
async function uploadAndProcess() {
    const base = document.getElementById('baseUrl').value.replace(/\/$/, '');
    const token = document.getElementById('authToken').value.trim();
    if (!token) { alert('Auth token required.'); return; }

    let audioBlob, filename;
    const fileInput = document.getElementById('audioFile');
    if (recordedBlob) {
        audioBlob = recordedBlob;
        filename = `recording.${audioBlob.type.includes('webm') ? 'webm' : 'm4a'}`;
    } else if (fileInput.files.length > 0) {
        audioBlob = fileInput.files[0];
        filename = audioBlob.name;
    } else {
        log('system', '⚠ No audio selected.'); return;
    }

    const textCtx = document.getElementById('voiceText').value.trim();
    const convId = document.getElementById('convId').value.trim();

    const form = new FormData();
    form.append('audio', audioBlob, filename);
    if (textCtx) form.append('message', textCtx);
    if (convId) form.append('conversation_id', convId);

    log('system', 'Uploading voice (HTTP)…');
    document.getElementById('sendVoiceBtn').disabled = true;
    document.getElementById('sendVoiceBtn').textContent = 'Uploading…';

    try {
        const resp = await fetch(`${base}/ai/chat/voice/upload/`, {
            method: 'POST',
            headers: { 'Authorization': `Token ${token}` },
            body: form,
        });
        const data = await resp.json();
        if (!resp.ok) { log('system', `❌ Upload failed: ${JSON.stringify(data)}`); return; }

        document.getElementById('convId').value = data.conversation_id;
        log('system', `Voice uploaded ✓ (voice_message_id: ${data.voice_message_id})`);
        logEvent({ type: 'user_voice', voice_message_id: data.voice_message_id });

        wsSend({ type: 'process_voice', voice_message_id: data.voice_message_id });
    } catch (err) {
        log('system', `❌ Upload error: ${err.message}`);
    } finally {
        document.getElementById('sendVoiceBtn').disabled = false;
        document.getElementById('sendVoiceBtn').textContent = 'Upload & Start Loop';
        recordedBlob = null;
    }
}

// ── Event handler ───────────────────────────────────────────
function handleEvent(data) {
    logEvent(data);

    switch (data.type) {
        case 'loop_started':
            currentLoopId = data.loop_id;
            totalTasks = data.task_count;
            currentTaskIndex = 0;
            document.getElementById('convId').value = data.conversation_id || document.getElementById('convId').value;
            showLoopPanel(`Loop started — ${data.task_count} task${data.task_count === 1 ? '' : 's'}`);
            setLoopContent(`<div id="thinkingAnim" style="display:none"></div>`);
            break;

        case 'thinking':
            currentTaskIndex = data.task_index;
            updateLoopProgress();
            setLoopContent(thinkingHTML(data.task_index + 1, totalTasks));
            break;

        case 'task_choices':
            currentTaskIndex = data.task_index;
            updateLoopProgress();
            setLoopContent(choicesHTML(data));
            break;

        case 'task_approved':
            appendLoopContent(`<div style="color:var(--accent);font-size:0.82rem;margin-bottom:6px">✓ Task ${data.task_index + 1} approved</div>`);
            break;

        case 'loop_complete':
            updateLoopProgress(true);
            appendLoopContent(`
                <div style="text-align:center;padding:16px;color:var(--primary);font-weight:700;font-size:1rem">
                    🎉 All tasks done!
                </div>
            `);
            currentLoopId = null;
            break;

        case 'chat_response':
            hideLoopPanel();
            break;

        case 'error':
            appendLoopContent(`<div style="color:var(--danger);font-size:0.82rem">⚠ ${data.code}: ${data.message}</div>`);
            break;
    }
}

// ── Loop panel helpers ──────────────────────────────────────
function showLoopPanel(title) {
    document.getElementById('loopPanel').style.display = 'block';
    document.getElementById('loopTitle').textContent = title;
}
function hideLoopPanel() {
    document.getElementById('loopPanel').style.display = 'none';
}
function setLoopContent(html) {
    document.getElementById('loopContent').innerHTML = html;
}
function appendLoopContent(html) {
    document.getElementById('loopContent').insertAdjacentHTML('beforeend', html);
}
function updateLoopProgress(done = false) {
    document.getElementById('loopProgress').textContent = done
        ? `${totalTasks}/${totalTasks} complete`
        : `Task ${currentTaskIndex + 1} / ${totalTasks}`;
}

function thinkingHTML(n, total) {
    return `
        <div id="thinkingAnim" style="padding:12px 0;">
            <div style="color:var(--warn);font-size:0.85rem;font-weight:600;display:flex;align-items:center;gap:8px;">
                Thinking about task ${n} of ${total}
                <span class="dot-pulse" style="display:inline-flex;gap:4px;">
                    <span></span><span></span><span></span>
                </span>
            </div>
        </div>
    `;
}

function choicesHTML(data) {
    const taskDesc = data.task_description || `Task ${data.task_index + 1}`;
    let html = '';

    // Show task description if provided
    if (data.task_description) {
        html += `<div class="task-desc">${escHtml(data.task_description)}</div>`;
    }

    if (!data.choices || data.choices.length === 0) {
        html += `<p style="color:var(--muted);font-size:0.82rem">No choices proposed for this task.</p>`;
    } else {
        data.choices.forEach((choice) => {
            const actions = choice.actions_payload || [];
            const actionsHtml = actions.length
                ? actions.map(a => `
                    <div class="action-row">
                        <span class="action-name">${escHtml(a.action_name)}</span>
                        — ${escHtml(a.params?.title || JSON.stringify(a.params || {}).slice(0, 80))}
                    </div>`).join('')
                : `<div class="action-row" style="color:var(--muted)">(no actions)</div>`;

            html += `
            <div class="choice-card" id="choice-${choice.id}">
                <div class="choice-id">ID: ${choice.id} · ${choice.choice_id_string}</div>
                ${actionsHtml}
                <div class="choice-actions-btns">
                    <button class="btn-accent" onclick="approveChoice('${choice.id}')">✓ Approve</button>
                </div>
            </div>`;
        });
    }

    // AI message text
    if (data.message) {
        html = `<div style="font-size:0.85rem;margin-bottom:10px;color:var(--text)">${escHtml(data.message)}</div>` + html;
    }

    // Decline section (always shown when there are choices)
    html += `
        <div class="decline-area">
            <div class="section-label">Decline all & explain</div>
            <textarea id="declineReason" placeholder="Tell PUP why you don't like these choices…" rows="2"></textarea>
            <button class="btn-danger" onclick="declineChoice()">✗ Decline</button>
        </div>
    `;

    return html;
}

// ── Approve / Decline ───────────────────────────────────────
function approveChoice(choiceId) {
    if (!currentLoopId) { log('system', '⚠ No active loop.'); return; }
    wsSend({ type: 'approve_choice', choice_id: choiceId, loop_id: currentLoopId });
    // Dim the choice card
    const card = document.getElementById(`choice-${choiceId}`);
    if (card) card.style.opacity = '0.4';
}

function declineChoice() {
    if (!currentLoopId) { log('system', '⚠ No active loop.'); return; }
    const reason = document.getElementById('declineReason').value.trim();
    if (!reason) { alert('Please explain why you are declining.'); return; }
    wsSend({ type: 'decline_choice', loop_id: currentLoopId, reason });
    document.getElementById('declineReason').value = '';
    appendLoopContent(`<div style="color:var(--muted);font-size:0.78rem;margin-top:4px">↩ Declined: "${escHtml(reason)}"</div>`);
}

// ── Recording ───────────────────────────────────────────────
async function toggleRecording() {
    const btn = document.getElementById('recordBtn');
    if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        btn.textContent = '🎤 Start Recording';
        btn.classList.remove('recording');
        clearInterval(recTimer);
        document.getElementById('recTimer').style.display = 'none';
        return;
    }
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
            ? 'audio/webm;codecs=opus' : 'audio/mp4';
        mediaRecorder = new MediaRecorder(stream, { mimeType });
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            const baseMime = mimeType.split(';')[0];
            recordedBlob = new Blob(audioChunks, { type: baseMime });
            stream.getTracks().forEach(t => t.stop());
            const url = URL.createObjectURL(recordedBlob);
            const audio = document.getElementById('previewAudio');
            audio.src = url;
            audio.style.display = 'block';
            document.getElementById('sendVoiceBtn').disabled = false;
        };

        mediaRecorder.start();
        btn.textContent = '⏹ Stop Recording';
        btn.classList.add('recording');
        recSeconds = 0;
        document.getElementById('recTimer').style.display = 'block';
        recTimer = setInterval(() => {
            recSeconds++;
            const m = String(Math.floor(recSeconds / 60)).padStart(2, '0');
            const s = String(recSeconds % 60).padStart(2, '0');
            document.getElementById('recTimer').textContent = `${m}:${s}`;
        }, 1000);
    } catch (err) {
        log('system', `Mic error: ${err.message}`);
    }
}

document.getElementById('audioFile').addEventListener('change', (e) => {
    if (e.target.files.length === 0) return;
    recordedBlob = null;
    const file = e.target.files[0];
    const audio = document.getElementById('previewAudio');
    audio.src = URL.createObjectURL(file);
    audio.style.display = 'block';
    document.getElementById('sendVoiceBtn').disabled = false;
});

// ── Log helpers ─────────────────────────────────────────────
function logEvent(data) {
    const el = document.getElementById('eventLog');
    // Remove placeholder
    const ph = el.querySelector('div[style]');
    if (ph && ph.textContent.includes('Connect')) ph.remove();

    const div = document.createElement('div');

    if (data.type === 'user_text') {
        div.className = 'event';
        div.style.cssText = 'border-color:var(--primary);background:rgba(124,92,252,0.08)';
        div.innerHTML = `<div class="event-type" style="color:var(--primary)">You (text)</div>${escHtml(data.content)}`;
    } else if (data.type === 'user_voice') {
        div.className = 'event';
        div.style.cssText = 'border-color:var(--primary);background:rgba(124,92,252,0.08)';
        div.innerHTML = `<div class="event-type" style="color:var(--primary)">You (voice)</div>🎤 voice_message_id: ${data.voice_message_id}`;
    } else if (data.type === 'thinking') {
        div.className = 'event thinking';
        div.innerHTML = `<div class="event-type">Thinking</div>Task ${data.task_index + 1}/${totalTasks}…`;
    } else if (data.type === 'loop_started') {
        div.className = 'event loop_started';
        div.innerHTML = `<div class="event-type">Loop Started</div>${data.task_count} task${data.task_count===1?'':'s'} · loop_id: ${data.loop_id}`;
    } else if (data.type === 'task_choices') {
        const n = (data.choices || []).length;
        div.className = 'event task_choices';
        div.innerHTML = `<div class="event-type">Task Choices</div>Task ${data.task_index + 1}/${data.total_tasks} — ${n} choice${n===1?'':'s'} proposed`;
    } else if (data.type === 'task_approved') {
        div.className = 'event task_approved';
        div.innerHTML = `<div class="event-type">Task Approved</div>Task ${data.task_index + 1} ✓`;
    } else if (data.type === 'loop_complete') {
        div.className = 'event loop_complete';
        div.innerHTML = `<div class="event-type">Loop Complete</div>🎉 All tasks handled!`;
    } else if (data.type === 'chat_response') {
        div.className = 'event chat_response';
        const content = data.message?.content || '(no content)';
        div.innerHTML = `<div class="event-type">PUP (chat)</div>${escHtml(content)}`;
    } else if (data.type === 'error') {
        div.className = 'event error';
        div.innerHTML = `<div class="event-type">Error · ${escHtml(data.code)}</div>${escHtml(data.message)}`;
    }

    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
}

function log(type, message) {
    const el = document.getElementById('eventLog');
    const ph = el.querySelector('div[style]');
    if (ph && ph.textContent.includes('Connect')) ph.remove();

    const div = document.createElement('div');
    div.className = 'event raw';
    div.innerHTML = `<span style="color:var(--muted)">[${type}]</span> ${escHtml(message)}`;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
}

function logRaw(text) {
    const el = document.getElementById('eventLog');
    const div = document.createElement('div');
    div.className = 'event raw';
    div.textContent = text;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
}

function clearLog() {
    document.getElementById('eventLog').innerHTML =
        '<div style="color:var(--muted);font-size:0.82rem;text-align:center;margin-top:40px">Log cleared.</div>';
}

// ── Conversation reload ──────────────────────────────────────
async function loadConversation() {
    const base = document.getElementById('baseUrl').value.replace(/\/$/, '');
    const token = document.getElementById('authToken').value.trim();
    const convId = document.getElementById('convId').value.trim();
    if (!token || !convId) { log('system', 'Token and Conversation ID are required.'); return; }

    try {
        const resp = await fetch(`${base}/ai/conversations/${convId}/`, {
            headers: { Authorization: `Token ${token}` },
        });
        const data = await resp.json();
        if (!resp.ok) { log('system', `❌ ${resp.status}: ${JSON.stringify(data)}`); return; }

        clearLog();
        (data.messages || []).forEach(msg => {
            const isVoice = !!msg.voice_url;
            const el = document.getElementById('eventLog');
            const div = document.createElement('div');
            div.className = 'event';
            div.style.cssText = msg.role === 'user'
                ? 'border-color:var(--primary);background:rgba(124,92,252,0.06)'
                : 'border-color:var(--accent)';
            const label = isVoice ? `${msg.role} (voice)` : msg.role;
            let body = '';
            if (isVoice && msg.voice_url) body += `<audio controls src="${msg.voice_url}" style="width:100%;height:32px;margin-bottom:4px"></audio>`;
            if (msg.content) body += escHtml(msg.content);
            if (msg.choices?.length) body += `<div style="font-size:0.72rem;color:var(--accent);margin-top:4px">${msg.choices.length} choice(s)</div>`;
            div.innerHTML = `<div class="event-type" style="color:var(--muted)">${label}</div>${body}`;
            el.appendChild(div);
        });
        log('system', `Loaded ${data.messages.length} messages`);
    } catch (err) {
        log('system', `❌ ${err.message}`);
    }
}

// ── Tabs ─────────────────────────────────────────────────────
function switchTab(tab) {
    document.getElementById('tabText').style.display = tab === 'text' ? 'block' : 'none';
    document.getElementById('tabVoice').style.display = tab === 'voice' ? 'block' : 'none';
    document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('active', (i === 0) === (tab === 'text')));
}

// ── Misc ──────────────────────────────────────────────────────
function setBadge(connected) {
    const b = document.getElementById('connBadge');
    b.textContent = connected ? '● Connected' : '● Disconnected';
    b.className = connected ? 'connected' : '';
}

function toggleRaw() {
    showRaw = !showRaw;
    document.getElementById('rawToggle').textContent = showRaw ? 'Hide raw events' : 'Show raw events';
}

function escHtml(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
